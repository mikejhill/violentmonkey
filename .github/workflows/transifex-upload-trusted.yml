name: Upload translations after trusted merge
on:
  push:
    branches: [main, master]
    paths: ['src/**']
permissions:
  contents: read

jobs:
  upload:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: package.json
      - name: Install
        run: pnpm ci
      - name: Upload translations
        run: node scripts/transifex.mjs update
        env:
          TRANSIFEX_TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}
